<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Wedding Album</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#18150f;
  --paper:#f4ede0;
  --text:#f0ece6;
  --muted:#998f85;
  --accent:#c9a96e;
  --border:rgba(255,255,255,0.07);
  --hdr:52px;
  --nav:60px;
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'DM Sans',sans-serif;font-weight:300;color:var(--text);touch-action:none;user-select:none}

header{
  position:fixed;top:0;left:0;right:0;height:var(--hdr);z-index:200;
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  background:rgba(18,14,9,0.95);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);
}
.album-title{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:300;font-style:italic;letter-spacing:0.1em;color:var(--accent)}
.hdr-right{display:flex;gap:7px}
.btn-icon{
  width:32px;height:32px;border:1px solid var(--border);background:rgba(255,255,255,0.04);
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--muted);transition:all .18s;font-size:14px;
}
.btn-icon:hover,.btn-icon.active{background:var(--accent);color:#111;border-color:var(--accent)}

/* Stage */
#stage{
  position:fixed;inset:0;
  padding-top:var(--hdr);padding-bottom:var(--nav);
  display:flex;align-items:center;justify-content:center;
  /* perspective for the 3D flip */
  perspective:2400px;
  perspective-origin:50% 48%;
}

/* ── BOOK CONTAINER ── */
#book{
  position:relative;
  display:flex;
  align-items:stretch;
  /* Very subtle downward tilt so it looks like a book on a table */
  transform:rotateX(3deg);
  transform-style:preserve-3d;
  filter:drop-shadow(0 30px 45px rgba(0,0,0,0.75));
  transition:width .35s ease, height .35s ease;
}

/* ── PAGE SLOTS ── */
.page-slot{
  position:relative;
  overflow:hidden;
  flex-shrink:0;
  background:var(--paper);
  transition:width .35s ease, height .35s ease;
}
#left-slot {border-radius:3px 0 0 3px}
#right-slot{border-radius:0 3px 3px 0}

/* Single-page (cover) mode: only one slot visible, centred */
#book.cover-mode #left-slot  { display:none }
#book.cover-mode #right-slot { border-radius:4px }
#book.cover-mode #spine      { display:none }

.page-slot canvas{display:block;width:100%;height:100%}

/* ── SPINE ── */
#spine{
  width:4px;flex-shrink:0;
  background:linear-gradient(to right,
    rgba(0,0,0,0.30) 0%,
    rgba(0,0,0,0.05) 40%,
    rgba(255,255,240,0.07) 50%,
    rgba(0,0,0,0.05) 60%,
    rgba(0,0,0,0.25) 100%);
  z-index:5;
}

/* Page labels */
.cover-label{
  position:absolute;bottom:12px;left:0;right:0;text-align:center;
  font-family:'Cormorant Garamond',serif;font-size:12px;font-style:italic;
  color:rgba(255,255,255,0.65);letter-spacing:0.2em;
  text-shadow:0 1px 6px rgba(0,0,0,0.7);pointer-events:none;z-index:5;
}
.page-num{
  position:absolute;font-family:'Cormorant Garamond',serif;font-size:11px;
  color:rgba(80,70,60,0.5);letter-spacing:0.14em;pointer-events:none;z-index:5;
}
#left-slot  .page-num{bottom:9px;right:12px}
#right-slot .page-num{bottom:9px;left:12px}

/* ── FLIP SCENE ──
   Two canvases (front-face, back-face) inside a 3D-flipping card.
   The card pivots around the spine (transform-origin = left edge = centre of book).
   Front canvas shows the departing page image.
   Back canvas shows the arriving page image (pre-drawn, revealed on flip).
*/
#flip-scene{
  position:absolute;
  top:0;
  transform-style:preserve-3d;
  pointer-events:none;
  z-index:50;
  will-change:transform;
  display:none;
}
#flip-scene.active{display:block}

#flip-front,#flip-back{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  overflow:hidden;
  border-radius:2px;
}
/* Back face is pre-rotated 180° so it shows when the card is flipped */
#flip-back{transform:rotateY(180deg)}

#flip-front canvas,
#flip-back  canvas{display:block;width:100%;height:100%}

/* Shading overlays — gradient divs inside each face */
#flip-front-shade,#flip-back-shade{
  position:absolute;inset:0;
  pointer-events:none;
  z-index:2;
}

/* Cast shadow that the turning page throws onto the static pages */
#flip-shadow{
  position:absolute;top:0;
  pointer-events:none;z-index:49;
  /* opacity & width animated by JS */
}

/* Progress */
#progress-bar{
  position:fixed;top:calc(var(--hdr) - 2px);left:0;height:2px;width:0%;
  background:linear-gradient(to right,var(--accent),#e8c88a);z-index:201;transition:width linear;
}

/* Nav */
nav{
  position:fixed;bottom:0;left:0;right:0;height:var(--nav);
  background:rgba(18,14,9,0.95);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;gap:20px;z-index:200;
}
.nav-btn{
  width:38px;height:38px;border:1px solid var(--border);background:rgba(255,255,255,0.04);
  border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--text);transition:all .18s;font-size:17px;
}
.nav-btn:hover:not(:disabled){background:var(--accent);color:#111;border-color:var(--accent)}
.nav-btn:disabled{opacity:0.18;cursor:default}
.page-indicator{
  font-family:'Cormorant Garamond',serif;font-size:13px;
  color:var(--muted);letter-spacing:0.12em;min-width:80px;text-align:center;
}

/* Zoom overlay */
#zoom-overlay{
  position:fixed;inset:0;z-index:300;
  background:rgba(10,8,5,0.97);
  display:none;align-items:center;justify-content:center;overflow:hidden;
}
#zoom-overlay.active{display:flex}
#zoom-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;cursor:grab;-webkit-user-drag:none}
#zoom-img.dragging{cursor:grabbing}
#zoom-close{
  position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:50%;
  background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.18);
  color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:301;
  transition:background .18s;
}
#zoom-close:hover{background:var(--accent);color:#111}
.zoom-hint{
  position:fixed;bottom:70px;left:50%;transform:translateX(-50%);
  font-size:10px;color:rgba(255,255,255,0.35);letter-spacing:0.16em;text-transform:uppercase;
  pointer-events:none;z-index:301;animation:fo 3s ease 2s forwards;white-space:nowrap;
}
@keyframes fo{to{opacity:0}}

/* Loader */
#loader{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  z-index:500;transition:opacity .55s;
}
#loader.hidden{opacity:0;pointer-events:none}
.loader-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;font-style:italic;color:var(--accent);letter-spacing:0.08em}
.loader-sub{font-size:10px;color:var(--muted);letter-spacing:0.22em;text-transform:uppercase}
.loader-ring{width:28px;height:28px;border:1px solid rgba(201,169,110,0.25);border-top-color:var(--accent);border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hint */
.hint{
  position:fixed;bottom:calc(var(--nav)+8px);left:50%;transform:translateX(-50%);
  font-size:10px;color:var(--muted);letter-spacing:0.16em;text-transform:uppercase;
  opacity:0;animation:fh 5s ease 2s forwards;pointer-events:none;z-index:50;white-space:nowrap;
}
@keyframes fh{0%{opacity:0}15%{opacity:1}80%{opacity:1}100%{opacity:0}}

:fullscreen #stage{padding:0;perspective:2400px}
:fullscreen header,:fullscreen nav{display:none}
:fullscreen #progress-bar{top:0}
</style>
</head>
<body>

<div id="loader">
  <p class="loader-title">Wedding Album</p>
  <div class="loader-ring"></div>
  <p class="loader-sub">Preparing your memories</p>
</div>

<header>
  <span class="album-title">Wedding Album</span>
  <div class="hdr-right">
    <button class="btn-icon" id="btn-zoom"       title="Zoom (Z)">🔍</button>
    <button class="btn-icon" id="btn-autoplay"   title="Autoplay (P)">▶</button>
    <button class="btn-icon" id="btn-fullscreen" title="Fullscreen (F)">⛶</button>
  </div>
</header>

<div id="progress-bar"></div>

<div id="stage">
  <div id="book">

    <!-- Left static page -->
    <div class="page-slot" id="left-slot">
      <canvas id="left-canvas"></canvas>
      <span class="cover-label" id="left-label"></span>
      <span class="page-num"    id="left-num"></span>
    </div>

    <!-- Spine crease -->
    <div id="spine"></div>

    <!-- Right static page -->
    <div class="page-slot" id="right-slot">
      <canvas id="right-canvas"></canvas>
      <span class="cover-label" id="right-label"></span>
      <span class="page-num"    id="right-num"></span>
    </div>

    <!-- 3-D flip card — pivots around left edge (= spine) -->
    <div id="flip-scene">
      <div id="flip-front">
        <canvas id="flip-front-canvas"></canvas>
        <div id="flip-front-shade"></div>
      </div>
      <div id="flip-back">
        <canvas id="flip-back-canvas"></canvas>
        <div id="flip-back-shade"></div>
      </div>
    </div>

    <!-- Shadow thrown by turning page -->
    <canvas id="flip-shadow"></canvas>

  </div><!-- #book -->
</div><!-- #stage -->

<div id="zoom-overlay">
  <button id="zoom-close">✕</button>
  <img id="zoom-img" alt="Zoomed photo" draggable="false"/>
  <p class="zoom-hint">Scroll or pinch · Drag to pan</p>
</div>

<p class="hint">← → keys to flip · click image to zoom · P autoplay</p>

<nav>
  <button class="nav-btn" id="btn-prev">&#8592;</button>
  <span class="page-indicator" id="indicator"></span>
  <button class="nav-btn" id="btn-next">&#8594;</button>
</nav>

<script>
/* ══════════════════════════════════════════════════════
   CONFIG
══════════════════════════════════════════════════════ */
const TOTAL_SPREADS  = 33;
const AUTOPLAY_DELAY = 4500;
const FLIP_MS        = 800;   // duration of page turn
const SPINE_W        = 4;

/*
  Page list:
    0       → cover-front  (single 12×18, shown centred alone)
    1…N     → spread       (12×36 split at centre)
    N+1     → cover-back   (single 12×18, shown centred alone)
*/
function buildPages() {
  const p = [];
  p.push({ type:'cover-front', src:'images/cover-front.jpg', label:'Front Cover' });
  for (let i = 1; i <= TOTAL_SPREADS; i++)
    p.push({ type:'spread', src:`images/${String(i).padStart(2,'0')}.jpg`, num:i });
  p.push({ type:'cover-back', src:'images/cover-back.jpg', label:'Back Cover' });
  return p;
}
const PAGES = buildPages();
const LAST  = PAGES.length - 1;

/* ══════════════════════════════════════════════════════
   LAYOUT
══════════════════════════════════════════════════════ */
function layout() {
  const vw = window.innerWidth;
  const vh = window.innerHeight - 52 - 60;
  // Page half ratio: 18" wide × 12" tall → 1.5 : 1
  let pw = Math.floor((vw - SPINE_W) / 2);
  let ph = Math.floor(pw / 1.5);
  if (ph > vh * 0.93) { ph = Math.floor(vh * 0.93); pw = Math.floor(ph * 1.5); }
  return { pw, ph, bw: pw * 2 + SPINE_W };
}

/* ══════════════════════════════════════════════════════
   IMAGE CACHE
══════════════════════════════════════════════════════ */
const cache = {};
function loadImg(src) {
  if (cache[src]) return cache[src].p || Promise.resolve(cache[src].el);
  const el = new Image();
  const p = new Promise(res => {
    el.src = src;
    const done = (ok) => { cache[src] = { el, ready: ok, p: null }; res(ok ? el : null); };
    el.decode().then(() => done(true)).catch(() => {
      el.onload  = () => done(true);
      el.onerror = () => done(false);
    });
  });
  cache[src] = { el, ready: false, p };
  return p;
}
function getImg(src) {
  const e = cache[src];
  return (e && e.ready && e.el.naturalWidth > 0) ? e.el : null;
}

/* ══════════════════════════════════════════════════════
   DRAW PAGE onto a canvas
   side: 'left' | 'right' | 'full'
   Fills the canvas — cover-fit (crop to fill, no letterbox)
══════════════════════════════════════════════════════ */
function drawPage(canvas, img, side) {
  const ctx = canvas.getContext('2d');
  const cw = canvas.width, ch = canvas.height;
  ctx.clearRect(0, 0, cw, ch);
  ctx.fillStyle = '#f2ece0';
  ctx.fillRect(0, 0, cw, ch);

  if (img && img.complete && img.naturalWidth > 0) {
    const iw = img.naturalWidth, ih = img.naturalHeight;
    let sx = 0, sy = 0, sw = iw, sh = ih;
    if (side === 'left')  { sx = 0;    sw = iw / 2; }
    if (side === 'right') { sx = iw/2; sw = iw / 2; }
    const scale = Math.max(cw / sw, ch / sh);
    const dw = sw * scale, dh = sh * scale;
    ctx.drawImage(img, sx, sy, sw, sh, (cw-dw)/2, (ch-dh)/2, dw, dh);
  }

  // Spine-side inner shadow
  if (side !== 'full') {
    const g = ctx.createLinearGradient(
      side === 'right' ? 0 : cw, 0,
      side === 'right' ? cw * 0.10 : cw * 0.90, 0
    );
    g.addColorStop(0, 'rgba(0,0,0,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cw, ch);
  }
}

/* ══════════════════════════════════════════════════════
   3-D PAGE FLIP (CSS transform — NO strip lines)

   We use two <canvas> elements inside a CSS preserve-3d
   container that we animate with rotateY().

   The flip-scene sits exactly over the page being turned.
   Its transform-origin is its LEFT edge (= the spine).

   Forward flip (page goes right → left):
     flip-scene placed over the RIGHT page slot
     at t=0  rotateY(0)     → front face visible, shows current right-page image
     at t=1  rotateY(-180°) → back  face visible, shows next   left-page  image

   Backward flip (page goes left → right):
     flip-scene placed over the LEFT page slot
     at t=0  rotateY(0)     → front face visible, shows current left-page  image
     at t=1  rotateY(180°)  → back  face visible, shows prev   right-page  image

   We also animate:
     • A gradient shading overlay on the front face (darkens as it turns)
     • A gradient shading overlay on the back  face (darkens as it turns)
     • A soft shadow canvas thrown onto the receiving page
══════════════════════════════════════════════════════ */
const flipScene  = document.getElementById('flip-scene');
const flipFront  = document.getElementById('flip-front');
const flipBack   = document.getElementById('flip-back');
const flipFC     = document.getElementById('flip-front-canvas');
const flipBC     = document.getElementById('flip-back-canvas');
const flipFS     = document.getElementById('flip-front-shade');
const flipBS     = document.getElementById('flip-back-shade');
const flipShadow = document.getElementById('flip-shadow');

let flipRAF  = null;
let isAnimating = false;

function startFlip(dir, frontImg, frontSide, backImg, backSide, pw, ph, bw, onDone) {
  // Size & position the flip-scene card
  flipScene.style.width  = pw + 'px';
  flipScene.style.height = ph + 'px';
  flipScene.style.top    = '0px';

  // For forward: scene starts over the right page, pivots at LEFT edge (spine)
  // For backward: scene starts over the left page, pivots at RIGHT edge (spine)
  if (dir === 'forward') {
    flipScene.style.left            = (pw + SPINE_W) + 'px';
    flipScene.style.transformOrigin = 'left center';
  } else {
    flipScene.style.left            = '0px';
    flipScene.style.transformOrigin = 'right center';
  }

  // Draw images onto the two face canvases
  flipFC.width = pw;  flipFC.height = ph;
  flipBC.width = pw;  flipBC.height = ph;
  drawPage(flipFC, frontImg, frontSide);
  drawPage(flipBC, backImg,  backSide);

  // Size the shadow canvas (full book width)
  flipShadow.width  = bw;
  flipShadow.height = ph;
  flipShadow.style.width  = bw + 'px';
  flipShadow.style.height = ph + 'px';
  flipShadow.style.left   = '0px';
  flipShadow.style.top    = '0px';

  flipScene.classList.add('active');

  // Reset transform
  flipScene.style.transition = 'none';
  flipScene.style.transform  = 'rotateY(0deg)';

  const t0 = performance.now();

  function tick(now) {
    const raw = Math.min((now - t0) / FLIP_MS, 1);
    // Ease: slow start, fast middle, slow end (ease-in-out-cubic)
    const ease = raw < 0.5
      ? 4 * raw * raw * raw
      : 1 - Math.pow(-2 * raw + 2, 3) / 2;

    // Rotation: forward 0 → -180, backward 0 → +180
    const deg = dir === 'forward' ? -180 * ease : 180 * ease;
    flipScene.style.transform = `rotateY(${deg}deg)`;

    // Shading: front darkens from 0° → 90° (ease out as it turns away)
    //          back  darkens from 180° → 90° (ease out as it faces forward)
    const absRad  = Math.abs(deg) * Math.PI / 180;
    const sinAbs  = Math.sin(absRad);               // 0→1→0 bell over the turn
    // front face shade: max darkness at 90° (edge-on)
    const frontAlpha = Math.min(0.55, sinAbs * 0.6);
    flipFS.style.background = `rgba(0,0,0,${frontAlpha.toFixed(3)})`;
    // back face shade: starts dark (facing away), clears as it faces viewer
    const backProg  = Math.max(0, (Math.abs(deg) - 90) / 90); // 0 at 90°, 1 at 180°
    const backAlpha = Math.min(0.45, (1 - backProg) * 0.5);
    flipBS.style.background = `rgba(0,0,0,${backAlpha.toFixed(3)})`;

    // Shadow on the receiving page
    drawShadow(flipShadow, deg, pw, bw, ph, dir);

    if (raw < 1) {
      flipRAF = requestAnimationFrame(tick);
    } else {
      // Done
      flipShadow.getContext('2d').clearRect(0, 0, bw, ph);
      flipScene.classList.remove('active');
      flipScene.style.transform = 'rotateY(0deg)';
      flipFS.style.background = 'transparent';
      flipBS.style.background = 'transparent';
      flipRAF = null;
      onDone();
    }
  }

  if (flipRAF) cancelAnimationFrame(flipRAF);
  flipRAF = requestAnimationFrame(tick);
}

/* Draw the soft shadow the turning page casts onto the static pages */
function drawShadow(canvas, deg, pw, bw, ph, dir) {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, bw, ph);

  const absAngle = Math.abs(deg);
  if (absAngle < 2 || absAngle > 178) return;

  // Shadow intensity peaks at 90° (page edge-on)
  const sinA = Math.sin(absAngle * Math.PI / 180);
  const maxAlpha = 0.38 * sinA;
  if (maxAlpha < 0.01) return;

  const pivot = pw + SPINE_W / 2;   // spine x
  const spreadPx = pw * 0.5 * sinA; // shadow width on receiving page

  // Shadow falls on the page the turning page is sweeping toward
  const shadowOnLeft = dir === 'forward';   // forward: shadow on left page

  let gx0, gx1;
  if (shadowOnLeft) {
    gx0 = pivot;
    gx1 = pivot - spreadPx;
  } else {
    gx0 = pivot;
    gx1 = pivot + spreadPx;
  }

  const g = ctx.createLinearGradient(gx0, 0, gx1, 0);
  g.addColorStop(0,    `rgba(0,0,0,${maxAlpha.toFixed(3)})`);
  g.addColorStop(0.5,  `rgba(0,0,0,${(maxAlpha * 0.4).toFixed(3)})`);
  g.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, bw, ph);
}

/* ══════════════════════════════════════════════════════
   DOM ELEMENTS
══════════════════════════════════════════════════════ */
const book       = document.getElementById('book');
const leftSlot   = document.getElementById('left-slot');
const rightSlot  = document.getElementById('right-slot');
const spine      = document.getElementById('spine');
const leftCanvas = document.getElementById('left-canvas');
const rightCanvas= document.getElementById('right-canvas');
const leftLabel  = document.getElementById('left-label');
const rightLabel = document.getElementById('right-label');
const leftNum    = document.getElementById('left-num');
const rightNum   = document.getElementById('right-num');
const indicator  = document.getElementById('indicator');
const btnPrev    = document.getElementById('btn-prev');
const btnNext    = document.getElementById('btn-next');

let cur = 0;
let autoTimer = null, isAutoplaying = false;

/* ══════════════════════════════════════════════════════
   LAYOUT APPLY
══════════════════════════════════════════════════════ */
function applyLayout(isCover) {
  const { pw, ph, bw } = layout();
  // Cover: show only right slot at single-page width, centred
  if (isCover) {
    leftCanvas.width  = pw; leftCanvas.height  = ph;
    rightCanvas.width = pw; rightCanvas.height = ph;
    rightSlot.style.width  = pw + 'px';
    rightSlot.style.height = ph + 'px';
    leftSlot.style.width   = pw + 'px';
    leftSlot.style.height  = ph + 'px';
    book.style.width  = pw + 'px';   // single page width
    book.style.height = ph + 'px';
    book.classList.add('cover-mode');
  } else {
    leftCanvas.width  = pw; leftCanvas.height  = ph;
    rightCanvas.width = pw; rightCanvas.height = ph;
    leftSlot.style.width   = pw + 'px';
    leftSlot.style.height  = ph + 'px';
    rightSlot.style.width  = pw + 'px';
    rightSlot.style.height = ph + 'px';
    book.style.width  = bw + 'px';
    book.style.height = ph + 'px';
    book.classList.remove('cover-mode');
  }
}

/* ══════════════════════════════════════════════════════
   RENDER STATIC SPREAD
══════════════════════════════════════════════════════ */
function render(idx) {
  const page = PAGES[idx];
  if (!page) return;

  leftLabel.textContent = rightLabel.textContent = '';
  leftNum.textContent   = rightNum.textContent   = '';

  const isCover = page.type !== 'spread';
  applyLayout(isCover);

  if (page.type === 'cover-front') {
    // Only right slot shown (cover-mode hides left)
    drawPage(rightCanvas, getImg(page.src), 'full');
    rightLabel.textContent = page.label;
  } else if (page.type === 'cover-back') {
    // In cover-mode, left is hidden; we repurpose right slot for back cover
    drawPage(rightCanvas, getImg(page.src), 'full');
    rightLabel.textContent = page.label;
  } else {
    const img = getImg(page.src);
    drawPage(leftCanvas,  img, 'left');
    drawPage(rightCanvas, img, 'right');
    leftNum.textContent = String(page.num);
  }

  // Indicator
  indicator.textContent = page.type === 'cover-front' ? 'Front Cover'
                        : page.type === 'cover-back'  ? 'Back Cover'
                        : `${page.num} / ${TOTAL_SPREADS}`;
  btnPrev.disabled = idx === 0;
  btnNext.disabled = idx === LAST;
}

/* ══════════════════════════════════════════════════════
   NAVIGATE
══════════════════════════════════════════════════════ */
function goTo(dir) {
  if (isAnimating) return;
  const next = dir === 'forward' ? cur + 1 : cur - 1;
  if (next < 0 || next > LAST) return;

  isAnimating = true;

  const { pw, ph, bw } = layout();
  const curPage  = PAGES[cur];
  const nextPage = PAGES[next];

  // Decide which images go on front/back of the flip card
  let frontImg, frontSide, backImg, backSide;

  if (dir === 'forward') {
    // Card starts over right page, shows right half of current, reveals left half of next
    if (curPage.type === 'spread')       { frontImg = getImg(curPage.src);  frontSide = 'right'; }
    else if (curPage.type === 'cover-front') { frontImg = getImg(curPage.src);  frontSide = 'full'; }
    else                                 { frontImg = null; frontSide = 'full'; }

    if (nextPage.type === 'spread')      { backImg  = getImg(nextPage.src); backSide  = 'left'; }
    else if (nextPage.type === 'cover-back')  { backImg  = getImg(nextPage.src); backSide  = 'full'; }
    else                                 { backImg  = null; backSide  = 'full'; }
  } else {
    // Card starts over left page, shows left half of current, reveals right half of prev
    if (curPage.type === 'spread')       { frontImg = getImg(curPage.src);  frontSide = 'left'; }
    else if (curPage.type === 'cover-back')   { frontImg = getImg(curPage.src);  frontSide = 'full'; }
    else                                 { frontImg = null; frontSide = 'full'; }

    if (nextPage.type === 'spread')      { backImg  = getImg(nextPage.src); backSide  = 'right'; }
    else if (nextPage.type === 'cover-front') { backImg  = getImg(nextPage.src); backSide  = 'full'; }
    else                                 { backImg  = null; backSide  = 'full'; }
  }

  // Make sure next image is ready, then animate
  loadImg(nextPage.src).then(() => {
    // Refresh frontImg/backImg after load in case they were null
    if (!frontImg && curPage.src)  frontImg = getImg(curPage.src);
    if (!backImg  && nextPage.src) backImg  = getImg(nextPage.src);

    // For cover transitions, expand to double-width before flip if going from cover→spread
    const needsExpand  = curPage.type !== 'spread' && nextPage.type === 'spread';
    const needsShrink  = curPage.type === 'spread' && nextPage.type !== 'spread';

    if (needsExpand) applyLayout(false);   // expand book before flip starts

    startFlip(dir, frontImg, frontSide, backImg, backSide, pw, ph, bw, () => {
      cur = next;
      render(cur);
      isAnimating = false;
      if (PAGES[cur + 1]) loadImg(PAGES[cur + 1].src);
      if (PAGES[cur - 1]) loadImg(PAGES[cur - 1].src);
    });
  });
}

/* ══════════════════════════════════════════════════════
   ZOOM
══════════════════════════════════════════════════════ */
const zoomOverlay = document.getElementById('zoom-overlay');
const zoomImg2    = document.getElementById('zoom-img');
const zoomClose   = document.getElementById('zoom-close');
let zoomOn = false, zScale = 1, zPan = {x:0,y:0}, zDrag = {on:false};
let pinchD = 0;

function openZoom() {
  const p = PAGES[cur];
  if (!p || !getImg(p.src)) return;
  zoomImg2.src = p.src;
  zScale = 1; zPan = {x:0,y:0}; applyZ();
  zoomOverlay.classList.add('active'); zoomOn = true;
}
function closeZoom() {
  zoomOverlay.classList.remove('active'); zoomOn = false;
  zScale = 1; zPan = {x:0,y:0}; applyZ();
}
function applyZ() {
  zoomImg2.style.transform = `translate(${zPan.x}px,${zPan.y}px) scale(${zScale})`;
}
zoomOverlay.addEventListener('wheel', e => {
  e.preventDefault();
  zScale = Math.max(0.4, Math.min(10, zScale * (e.deltaY > 0 ? 0.88 : 1.14)));
  applyZ();
}, {passive:false});
zoomImg2.addEventListener('mousedown', e => {
  if (e.button) return;
  zDrag = {on:true, sx:e.clientX-zPan.x, sy:e.clientY-zPan.y};
  zoomImg2.classList.add('dragging'); e.preventDefault();
});
window.addEventListener('mousemove', e => {
  if (!zDrag.on) return;
  zPan.x = e.clientX-zDrag.sx; zPan.y = e.clientY-zDrag.sy; applyZ();
});
window.addEventListener('mouseup', () => { zDrag.on=false; zoomImg2.classList.remove('dragging'); });
zoomOverlay.addEventListener('touchstart', e => {
  if (e.touches.length===2) pinchD = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  else zDrag = {on:true, sx:e.touches[0].clientX-zPan.x, sy:e.touches[0].clientY-zPan.y};
  e.stopPropagation();
},{passive:true});
zoomOverlay.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===2) {
    const d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    zScale = Math.max(0.4, Math.min(10, zScale*(d/pinchD))); pinchD = d; applyZ();
  } else if (zDrag.on) { zPan.x = e.touches[0].clientX-zDrag.sx; zPan.y = e.touches[0].clientY-zDrag.sy; applyZ(); }
},{passive:false});
zoomOverlay.addEventListener('touchend', () => { zDrag.on=false; });
zoomClose.addEventListener('click', closeZoom);
zoomOverlay.addEventListener('click', e => { if (e.target===zoomOverlay) closeZoom(); });
leftSlot.addEventListener('click',  () => { if (!isAnimating) openZoom(); });
rightSlot.addEventListener('click', () => { if (!isAnimating) openZoom(); });

/* ══════════════════════════════════════════════════════
   AUTOPLAY
══════════════════════════════════════════════════════ */
const btnAuto = document.getElementById('btn-autoplay');
const progBar = document.getElementById('progress-bar');
function startAuto() {
  isAutoplaying=true; btnAuto.classList.add('active'); btnAuto.textContent='⏸'; tickAuto();
}
function stopAuto() {
  isAutoplaying=false; btnAuto.classList.remove('active'); btnAuto.textContent='▶';
  clearTimeout(autoTimer); progBar.style.transition='none'; progBar.style.width='0%';
}
function tickAuto() {
  if (!isAutoplaying) return;
  progBar.style.transition='none'; progBar.style.width='0%';
  requestAnimationFrame(() => { progBar.style.transition=`width ${AUTOPLAY_DELAY}ms linear`; progBar.style.width='100%'; });
  autoTimer = setTimeout(() => {
    if (cur>=LAST) { stopAuto(); return; }
    goTo('forward');
    setTimeout(tickAuto, FLIP_MS + 120);
  }, AUTOPLAY_DELAY);
}
btnAuto.addEventListener('click', () => isAutoplaying ? stopAuto() : startAuto());

/* ══════════════════════════════════════════════════════
   CONTROLS
══════════════════════════════════════════════════════ */
document.getElementById('btn-zoom').addEventListener('click', () => zoomOn ? closeZoom() : openZoom());
btnPrev.addEventListener('click', () => { if (zoomOn) return; stopAuto(); goTo('backward'); });
btnNext.addEventListener('click', () => { if (zoomOn) return; stopAuto(); goTo('forward'); });

const btnFS = document.getElementById('btn-fullscreen');
btnFS.addEventListener('click', () => {
  if (!document.fullscreenElement) { document.documentElement.requestFullscreen(); btnFS.textContent='✕'; }
  else { document.exitFullscreen(); btnFS.textContent='⛶'; }
});
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) btnFS.textContent='⛶'; });

document.addEventListener('keydown', e => {
  if (zoomOn) { if (e.key==='Escape'||e.key==='z'||e.key==='Z') closeZoom(); return; }
  if (e.key==='ArrowRight'||e.key===' ') { stopAuto(); goTo('forward');  e.preventDefault(); }
  if (e.key==='ArrowLeft')               { stopAuto(); goTo('backward'); e.preventDefault(); }
  if (e.key==='f'||e.key==='F')           { btnFS.click(); }
  if (e.key==='p'||e.key==='P')           { btnAuto.click(); }
  if (e.key==='z'||e.key==='Z')           { openZoom(); }
  if (e.key==='Escape')                   { stopAuto(); }
});

let tSX=0, tSY=0;
document.addEventListener('touchstart', e => { if (zoomOn) return; tSX=e.touches[0].clientX; tSY=e.touches[0].clientY; },{passive:true});
document.addEventListener('touchend', e => {
  if (zoomOn) return;
  const dx=e.changedTouches[0].clientX-tSX, dy=e.changedTouches[0].clientY-tSY;
  if (Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4) { stopAuto(); dx<0?goTo('forward'):goTo('backward'); }
});

window.addEventListener('resize', () => {
  const isCover = PAGES[cur].type !== 'spread';
  applyLayout(isCover); render(cur);
});

/* ══════════════════════════════════════════════════════
   INIT
══════════════════════════════════════════════════════ */
async function init() {
  applyLayout(true); // start in cover mode
  const loader = document.getElementById('loader');
  await Promise.all(PAGES.slice(0, 3).map(p => loadImg(p.src)));
  render(0);
  loader.classList.add('hidden');
  setTimeout(() => loader.remove(), 600);
  // Background preload in batches of 3
  const rest = PAGES.slice(3);
  let i = 0;
  (function batch() {
    if (i >= rest.length) return;
    Promise.all(rest.slice(i, i+=3).map(p => loadImg(p.src))).then(batch);
  })();
}

init();
</script>
</body>
