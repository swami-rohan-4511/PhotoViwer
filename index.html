<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photo Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f3ef;
      --surface: #faf9f7;
      --text: #1a1a18;
      --muted: #888880;
      --accent: #2a2a28;
      --border: rgba(0,0,0,0.08);

      /*
        Album is 36" wide × 12" tall (open spread).
        Each page = 18" × 12" → aspect ratio 1.5 : 1 (landscape).
        We calculate page-w so the full spread fits within 96vw,
        then derive page-h from the real 18:12 = 3:2 ratio.
        Also capped so the height never exceeds available vertical space.
      */
      --page-w: min(calc(96vw / 2), calc((100vh - 148px) * 1.5));
      --page-h: calc(var(--page-w) / 1.5);   /* 18:12 = 1.5:1 */
      --spine: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      color: var(--text);
      overflow: hidden;
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .album-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 0.08em;
      font-style: italic;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      width: 36px; height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--muted);
      transition: all 0.2s;
      font-size: 16px;
    }
    .btn-icon:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-icon.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ── STAGE ── */
    #stage {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-top: 64px;
      padding-bottom: 72px;
      perspective: 2400px;
    }

    /* ── BOOK ── */
    #book {
      position: relative;
      width: calc(var(--page-w) * 2 + var(--spine));
      height: var(--page-h);
      display: flex;
      align-items: center;
    }

    /* Spine shadow */
    #book::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 0; bottom: 0;
      width: var(--spine);
      transform: translateX(-50%);
      background: linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0.02) 40%, rgba(0,0,0,0.02) 60%, rgba(0,0,0,0.08));
      z-index: 10;
      pointer-events: none;
    }

    /* ── PAGES ── */
    .page-slot {
      width: var(--page-w);
      height: var(--page-h);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .page-slot.left  { border-radius: 4px 0 0 4px; }
    .page-slot.right { border-radius: 0 4px 4px 0; }

    .page {
      position: absolute;
      width: 100%; height: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
    }
    .page img {
      width: 100%; height: 100%;
      object-fit: contain;   /* panoramic 3:2 ratio — show full image, no crop */
      object-position: center;
      display: block;
      background: #f0ede8;   /* subtle warm fill behind any letterbox area */
    }
    .page-number {
      position: absolute;
      bottom: 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.12em;
    }
    .page-slot.left  .page-number { right: 18px; }
    .page-slot.right .page-number { left: 18px; }

    /* Placeholder for empty side */
    .page.empty {
      background: var(--surface);
    }
    .page.empty::after {
      content: '';
      display: block;
      width: 40px; height: 40px;
      border: 1px solid var(--border);
      border-radius: 50%;
    }

    /* ── FLIP LAYER ── */
    /* The flipping page lives in .flip-wrap which is absolutely placed over the book */
    #flip-wrap {
      position: absolute;
      top: 0; left: 50%;
      width: var(--page-w);
      height: var(--page-h);
      transform-origin: left center;
      transform-style: preserve-3d;
      z-index: 20;
      pointer-events: none;
      will-change: transform;
    }
    #flip-wrap.flipping-forward {
      animation: flipForward 0.7s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }
    #flip-wrap.flipping-backward {
      animation: flipBackward 0.7s cubic-bezier(0.45, 0, 0.55, 1) forwards;
    }

    @keyframes flipForward {
      0%   { transform: rotateY(0deg); }
      100% { transform: rotateY(-180deg); }
    }
    @keyframes flipBackward {
      0%   { transform: rotateY(-180deg); }
      100% { transform: rotateY(0deg); }
    }

    .flip-front, .flip-back {
      position: absolute;
      width: 100%; height: 100%;
      backface-visibility: hidden;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
    }
    .flip-back {
      transform: rotateY(180deg);
    }
    .flip-front img, .flip-back img {
      width: 100%; height: 100%;
      object-fit: contain;
      object-position: center;
      display: block;
      background: #f0ede8;
    }

    /* Page curl shadow while flipping */
    #flip-wrap.flipping-forward .flip-front::after,
    #flip-wrap.flipping-backward .flip-back::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, transparent 60%, rgba(0,0,0,0.18));
      animation: shadowSweep 0.7s ease forwards;
    }
    @keyframes shadowSweep {
      0%   { opacity: 0; }
      40%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ── BOTTOM NAV ── */
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 68px;
      background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 100;
    }

    .nav-btn {
      width: 42px; height: 42px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text);
      transition: all 0.2s;
      font-size: 18px;
    }
    .nav-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }

    .page-indicator {
      font-family: 'Cormorant Garamond', serif;
      font-size: 15px;
      color: var(--muted);
      letter-spacing: 0.1em;
      min-width: 100px;
      text-align: center;
    }

    /* ── AUTOPLAY PROGRESS ── */
    #progress-bar {
      position: fixed;
      top: 63px; left: 0;
      height: 2px;
      background: var(--accent);
      width: 0%;
      z-index: 99;
      transition: width linear;
    }

    /* ── FULLSCREEN ── */
    :fullscreen #stage   { padding: 0; background: #111; }
    :fullscreen header,
    :fullscreen nav      { display: none; }
    :fullscreen #book    {
      /* In fullscreen, fill the wide screen edge-to-edge with the panoramic spread */
      --page-w: min(calc(99vw / 2), calc(99vh * 1.5));
      --page-h: calc(var(--page-w) / 1.5);
    }
    :fullscreen #progress-bar { top: 0; }

    /* ── LOADING ── */
    #loader {
      position: fixed; inset: 0;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
      z-index: 200;
      transition: opacity 0.5s;
    }
    #loader.hidden { opacity: 0; pointer-events: none; }
    .loader-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 300;
      font-style: italic;
      letter-spacing: 0.06em;
    }
    .loader-sub {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .loader-ring {
      width: 32px; height: 32px;
      border: 1px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── KEYBOARD HINT ── */
    .hint {
      position: fixed;
      bottom: 82px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeHint 4s ease 1.5s forwards;
      pointer-events: none;
      z-index: 50;
    }
    @keyframes fadeHint {
      0%   { opacity: 0; }
      20%  { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* Responsive — panoramic album on small screens */
    @media (max-width: 768px) {
      :root {
        --page-w: calc(48vw - 4px);
        --page-h: calc(var(--page-w) / 1.5);
        --spine: 5px;
      }
      .album-title { font-size: 15px; }
      #book::after { display: none; }
    }
    @media (max-width: 480px) {
      :root {
        --page-w: calc(48vw - 2px);
        --page-h: calc(var(--page-w) / 1.5);
        --spine: 3px;
      }
    }
  </style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <p class="loader-title">Photo Album</p>
  <div class="loader-ring"></div>
  <p class="loader-sub">Loading images</p>
</div>

<!-- Header -->
<header>
  <span class="album-title">Photo Album</span>
  <div class="header-controls">
    <button class="btn-icon" id="btn-autoplay" title="Autoplay" aria-label="Toggle autoplay">
      ▶
    </button>
    <button class="btn-icon" id="btn-fullscreen" title="Fullscreen" aria-label="Toggle fullscreen">
      ⛶
    </button>
  </div>
</header>

<!-- Autoplay progress -->
<div id="progress-bar"></div>

<!-- Stage -->
<div id="stage">
  <div id="book">
    <!-- Left page -->
    <div class="page-slot left" id="left-slot">
      <div class="page" id="left-page">
        <img id="left-img" src="" alt="" />
        <span class="page-number" id="left-num"></span>
      </div>
    </div>

    <!-- Right page -->
    <div class="page-slot right" id="right-slot">
      <div class="page" id="right-page">
        <img id="right-img" src="" alt="" />
        <span class="page-number" id="right-num"></span>
      </div>
    </div>

    <!-- Flip overlay -->
    <div id="flip-wrap">
      <div class="flip-front"><img id="flip-front-img" src="" alt="" /></div>
      <div class="flip-back"><img id="flip-back-img" src="" alt="" /></div>
    </div>
  </div>
</div>

<!-- Keyboard hint -->
<p class="hint">← → arrow keys to navigate</p>

<!-- Bottom nav -->
<nav>
  <button class="nav-btn" id="btn-prev" aria-label="Previous">&#8592;</button>
  <span class="page-indicator" id="indicator">1 / 35</span>
  <button class="nav-btn" id="btn-next" aria-label="Next">&#8594;</button>
</nav>

<script>
  /* ─── CONFIG ───────────────────────────────────────────────
     Edit IMAGES array below. Each entry is a path to your image.
     Naming convention: images/01.jpg … images/35.jpg
     Total count auto-detected from array length.
  ─────────────────────────────────────────────────────────── */
  const AUTOPLAY_DELAY = 4000; // ms per spread

  // Auto-generate image list for 35 photos (images/01.jpg … images/35.jpg)
  const IMAGES = Array.from({ length: 35 }, (_, i) => {
    const n = String(i + 1).padStart(2, '0');
    return `images/${n}.jpg`;
  });

  /* ─── STATE ─────────────────────────────────────────────── */
  // "spread index" = which pair is showing
  // spread 0 → images[0] (left cover), images[1] (right)
  // spread 1 → images[2], images[3]  …
  const total = IMAGES.length;
  let spreadIndex = 0;               // current spread
  const spreads = Math.ceil(total / 2); // total spreads
  let isAnimating = false;
  let autoplayTimer = null;
  let isAutoplaying = false;

  /* ─── ELEMENTS ──────────────────────────────────────────── */
  const leftImg    = document.getElementById('left-img');
  const rightImg   = document.getElementById('right-img');
  const leftNum    = document.getElementById('left-num');
  const rightNum   = document.getElementById('right-num');
  const flipWrap   = document.getElementById('flip-wrap');
  const flipFront  = document.getElementById('flip-front-img');
  const flipBack   = document.getElementById('flip-back-img');
  const indicator  = document.getElementById('indicator');
  const btnPrev    = document.getElementById('btn-prev');
  const btnNext    = document.getElementById('btn-next');
  const btnFS      = document.getElementById('btn-fullscreen');
  const btnAuto    = document.getElementById('btn-autoplay');
  const loader     = document.getElementById('loader');
  const progress   = document.getElementById('progress-bar');

  /* ─── IMAGE MANAGEMENT ──────────────────────────────────── */
  function imgForSpread(si) {
    // returns [leftSrc, rightSrc] for a given spreadIndex
    const l = si * 2;
    const r = l + 1;
    return [
      l < total ? IMAGES[l] : null,
      r < total ? IMAGES[r] : null,
    ];
  }

  function applySpread(si, animated) {
    const [l, r] = imgForSpread(si);
    setPage(leftImg,  leftNum,  l, si * 2 + 1);
    setPage(rightImg, rightNum, r, si * 2 + 2);
    updateUI();
  }

  function setPage(imgEl, numEl, src, num) {
    if (src) {
      imgEl.src = src;
      imgEl.style.display = 'block';
      numEl.textContent = num <= total ? num : '';
    } else {
      imgEl.src = '';
      imgEl.style.display = 'none';
      numEl.textContent = '';
    }
  }

  function updateUI() {
    const l = spreadIndex * 2 + 1;
    const r = Math.min(spreadIndex * 2 + 2, total);
    indicator.textContent = l === r
      ? `${l} / ${total}`
      : `${l}–${r} / ${total}`;
    btnPrev.disabled = spreadIndex === 0;
    btnNext.disabled = spreadIndex >= spreads - 1;
  }

  /* ─── FLIP ANIMATION ────────────────────────────────────── */
  function flip(direction) {
    if (isAnimating) return;
    if (direction === 'forward' && spreadIndex >= spreads - 1) return;
    if (direction === 'backward' && spreadIndex === 0) return;

    isAnimating = true;

    const nextSpread = direction === 'forward' ? spreadIndex + 1 : spreadIndex - 1;
    const [nextL, nextR] = imgForSpread(nextSpread);

    if (direction === 'forward') {
      // Front of flipping page = current right page
      const [, curR] = imgForSpread(spreadIndex);
      flipFront.src = curR || '';
      // Back of flipping page = next left page
      flipBack.src = nextL || '';
      // Pre-load next right into left slot (it will be revealed after flip)
      // right slot stays as is; after flip we show nextSpread
    } else {
      // Backward: front(visible initially on left) = next right
      // flip-wrap is positioned at center; we reverse
      flipBack.src  = nextR || '';
      flipFront.src = imgForSpread(spreadIndex)[0] || ''; // current left
    }

    flipWrap.style.display = 'block';
    flipWrap.classList.add(direction === 'forward' ? 'flipping-forward' : 'flipping-backward');

    flipWrap.addEventListener('animationend', () => {
      flipWrap.classList.remove('flipping-forward', 'flipping-backward');
      flipWrap.style.display = 'none';
      spreadIndex = nextSpread;
      applySpread(spreadIndex);
      isAnimating = false;
    }, { once: true });
  }

  /* ─── AUTOPLAY ──────────────────────────────────────────── */
  function startAutoplay() {
    isAutoplaying = true;
    btnAuto.classList.add('active');
    btnAuto.textContent = '⏸';
    scheduleNext();
  }

  function stopAutoplay() {
    isAutoplaying = false;
    btnAuto.classList.remove('active');
    btnAuto.textContent = '▶';
    clearTimeout(autoplayTimer);
    progress.style.transition = 'none';
    progress.style.width = '0%';
  }

  function scheduleNext() {
    if (!isAutoplaying) return;
    progress.style.transition = 'none';
    progress.style.width = '0%';
    requestAnimationFrame(() => {
      progress.style.transition = `width ${AUTOPLAY_DELAY}ms linear`;
      progress.style.width = '100%';
    });
    autoplayTimer = setTimeout(() => {
      if (spreadIndex >= spreads - 1) {
        stopAutoplay();
        return;
      }
      flip('forward');
      // wait for animation then schedule next
      setTimeout(scheduleNext, 750);
    }, AUTOPLAY_DELAY);
  }

  btnAuto.addEventListener('click', () => {
    isAutoplaying ? stopAutoplay() : startAutoplay();
  });

  /* ─── FULLSCREEN ────────────────────────────────────────── */
  btnFS.addEventListener('click', () => {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen();
      btnFS.textContent = '✕';
    } else {
      document.exitFullscreen();
      btnFS.textContent = '⛶';
    }
  });
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement) btnFS.textContent = '⛶';
  });

  /* ─── NAV BUTTONS ───────────────────────────────────────── */
  btnNext.addEventListener('click', () => { stopAutoplay(); flip('forward'); });
  btnPrev.addEventListener('click', () => { stopAutoplay(); flip('backward'); });

  /* ─── KEYBOARD ──────────────────────────────────────────── */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { stopAutoplay(); flip('forward'); }
    if (e.key === 'ArrowLeft')                   { stopAutoplay(); flip('backward'); }
    if (e.key === 'f' || e.key === 'F')           { btnFS.click(); }
    if (e.key === 'p' || e.key === 'P')           { btnAuto.click(); }
  });

  /* ─── SWIPE SUPPORT ─────────────────────────────────────── */
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) {
      stopAutoplay();
      dx < 0 ? flip('forward') : flip('backward');
    }
  });

  /* ─── INIT ──────────────────────────────────────────────── */
  // Pre-load first two images then hide loader
  let loaded = 0;
  function tryLoad() {
    loaded++;
    if (loaded >= 2) {
      loader.classList.add('hidden');
      setTimeout(() => loader.remove(), 600);
    }
  }

  const preL = new Image();
  const preR = new Image();
  preL.onload = preL.onerror = tryLoad;
  preR.onload = preR.onerror = tryLoad;
  const [first, second] = imgForSpread(0);
  preL.src = first  || '';
  preR.src = second || '';

  applySpread(0);
  flipWrap.style.display = 'none';
</script>
</body>
</html>
